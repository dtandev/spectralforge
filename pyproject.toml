[project]
name = "spectralforge"
version = "0.0.1"
description = "Python library for processing and analyzing spectral data"  # TODO: verify this
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dariusz Tanajewski" }
]

dependencies = [
    # TODO: verify this — carried over from the now-deleted setup.py's install_requires;
    # none of these are actually imported anywhere in the codebase yet since
    # src/main.py has no real logic. Confirm which are still needed.
    "geopandas>=0.14.3",
    "numpy>=1.26.4",
    "matplotlib>=3.8.4",
    "rasterio>=1.3.9",
    "beautifulsoup4>=4.12.3",
    "shapely>=2.0.4",
    "json5>=0.9.25",
    "scipy>=1.13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Database access through spectralhub (src/db.py, scripts/inspect_live_db_schema.py).
# spectralhub lives in a PRIVATE repo, so it is kept out of the default install:
# CI and contributors without access can still `uv sync`. With access: `uv sync --extra db`.
db = [
    "spectralhub",
    "psycopg2-binary>=2.9.10",
    # TODO: verify this — geopy is imported by spectralhub/database.py and utils.py
    # (Nominatim geocoding) but is NOT declared in spectralhub's own setup.py
    # install_requires. Declared here as a workaround; consider reporting/fixing upstream
    # in the spectralhub repo instead of relying on this transitively.
    "geopy>=2.4",
]

[tool.uv.sources]
# TODO: verify this — pinned to main until spectralhub cuts tagged releases; consider
# pinning to a specific commit/tag once one exists, so `uv sync` is fully reproducible.
spectralhub = { git = "https://github.com/FourPointSPZOO/spectralhub.git" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "commitizen>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lets every ruff version (incl. the older one pinned in pre-commit) see `spectralforge`
# as first-party, so import sorting is the same everywhere.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["product.yaml:version"]

[tool.black]
line-length = 160
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = ["h4e_ml"]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    'venv',
    '\.venv',
    '\.git',
    '__pycache__',
    'data',
    'notebooks',
]

[[tool.mypy.overrides]]
module = [
    "rsom_ml_pipelines.*",
    "mlflow.*",
    "sqlalchemy.*",
    "geoalchemy2.*",
    "tqdm.*",
    "geopandas.*",
    "shapely.*",
    "pandas.*",
    "rasterio.*",
    "pydantic.*",
    "sentinelhub.*",
    "pystac_client.*",
    "sentinelsat.*",
    "azure.*",
    "planetary_computer.*",
    "pystac.*",
    "stackstac.*",
    "xarray.*",
    "rioxarray.*",
    "xrspatial.*",
    "numpy.*",
    "distributed.*",
    "dask_gateway.*",
    "kornia.*",
    "torch.*",
    "azureml.core.*",
    "flash.*",
    "flash.image.*",
    "pytorch_lightning.*",
    "torch.nn.*",
    "torch.utils.data.*",
    "pytorch_lightning.*",
    "retry.*",
    "ttach.*",
    "matplotlib.*",
    "torchmetrics.*",
    "torchvision.*",
    "dotenv.*",
    "geojson.*",
    "area.*",
    "cv2.*",
    "sklearn.*",
    "joblib.*",
    "click.*",
    "morecantile.*",
    "rio_cogeo.*",
    "yaml.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectralforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--ignore data --ignore notebooks --ignore build_tools --ignore examples --ignore docs"
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark test as an integration test.",
    "e2e: mark test as an end to end test.",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore:numpy.dtype size changed",
    "ignore:numpy.ufunc size changed",
    "ignore:.*Passing field metadata as keyword arguments is deprecated*:DeprecationWarning:",
    "ignore:.*The 'default' argument to fields is deprecated. Use 'dump_default' instead*:DeprecationWarning:",
    "ignore:.*The 'missing' argument to fields is deprecated. Use 'load_default' instead*:DeprecationWarning:",
    "ignore:.*skip_equivalent is deprecated.*:DeprecationWarning:",
    "ignore:.*numpy.ndarray size changed, may indicate binary incompatibility.*:RuntimeWarning:",
    "ignore:.*pandas.Int64Index is deprecated and will be removed from pandas in a future version.*:FutureWarning:",
    "ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning:",
    "ignore:.*FileType Enum is Deprecated in > 1.0.39. Use strings instead.*:DeprecationWarning:",
    "ignore:.*Jupyter is migrating its paths to use standard platformdirs*:DeprecationWarning:",
]


[tool.check-manifest]
ignore = [
    ".binder/**",
    ".all-contributorsrc",
    ".coveragerc",
    "examples/**",
    "build_tools/**",
    "__check_build/**",
    "docs/**",
    "Makefile",
    "CODEOWNERS",
    "CONTRIBUTING.md",
    "*.yaml",
    "*.yml"
]
